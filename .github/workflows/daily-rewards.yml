name: Daily Microsoft Rewards

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACCOUNT_1_EMAIL: ${{ secrets.ACCOUNT_1_EMAIL }}
      ACCOUNT_1_PASSWORD: ${{ secrets.ACCOUNT_1_PASSWORD }}
      ACCOUNT_1_TOTP_SECRET: ${{ secrets.ACCOUNT_1_TOTP_SECRET }}
      ACCOUNT_1_GEO_LOCALE: ${{ secrets.ACCOUNT_1_GEO_LOCALE || 'auto' }}
      ACCOUNT_1_LANG_CODE: ${{ secrets.ACCOUNT_1_LANG_CODE || 'en' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Chromium (for API mode browser needs)
        run: npm run install:browser

      - name: Build
        run: npm run build

      - name: Run Microsoft Rewards (API Mode)
        run: |
          cat > config.api.json <<'EOF'
          {
            "sessionPath": "sessions",
            "headless": true,
            "clusters": 1,
            "rewardsMode": "api",
            "errorDiagnostics": true,
            "ensureStreakProtection": true,
            "autoClaimPunchcardRewards": true,
            "continueOnBotWarning": true,
            "skipNonPointTasks": true,
            "accountDelay": { "min": "30sec", "max": "60sec" },
            "taskDelay": { "min": "15sec", "max": "30sec" },
            "workers": {
              "doDailySet": true,
              "doClaimBonusPoints": true,
              "doMorePromotions": true,
              "doPunchCards": true,
              "doAppPromotions": false,
              "doDesktopSearch": true,
              "doMobileSearch": true,
              "doBonusSearches": true,
              "doDailyCheckIn": true,
              "doReadToEarn": false,
              "doActivateSearchPerk": true,
              "doVisualSearch": false
            },
            "activities": { "urlReward": true, "searchOnBing": true },
            "searchOnBingLocalQueries": false,
            "globalTimeout": "30sec",
            "searchSettings": {
              "maxSearchOnBingAttempts": 3,
              "scrollRandomResults": false,
              "clickRandomResults": false,
              "runOnZeroPoints": false,
              "maxBonusSearches": 90,
              "parallelSearching": false,
              "clusterSearch": false,
              "useAccountLocale": true,
              "queryEngines": ["google", "local", "wikipedia"],
              "searchResultVisitTime": "10sec",
              "searchDelay": { "min": "30sec", "max": "60sec" },
              "readDelay": { "min": "30sec", "max": "60sec" }
            },
            "experimental": { "blockMedia": true, "edgeBrowsing": false, "browserSearchApiReport": false },
            "debugLogs": true,
            "consoleLogFilter": { "enabled": false, "mode": "whitelist", "levels": ["error", "warn"], "keywords": [], "regexPatterns": [] },
            "proxy": { "queryEngine": true, "ignoreCertificateErrors": false },
            "webhook": { "discord": { "enabled": false }, "telegram": { "enabled": false }, "ntfy": { "enabled": false }, "webhookLogFilter": { "enabled": false } }
          }
          EOF
          CONFIG_FILE=config.api.json timeout 1800 node dist/index.js
        env:
          ACCOUNT_1_EMAIL: ${{ secrets.ACCOUNT_1_EMAIL }}
          ACCOUNT_1_PASSWORD: ${{ secrets.ACCOUNT_1_PASSWORD }}
          ACCOUNT_1_TOTP_SECRET: ${{ secrets.ACCOUNT_1_TOTP_SECRET }}
          ACCOUNT_1_GEO_LOCALE: ${{ secrets.ACCOUNT_1_GEO_LOCALE || 'auto' }}
          ACCOUNT_1_LANG_CODE: ${{ secrets.ACCOUNT_1_LANG_CODE || 'en' }}